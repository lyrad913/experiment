services:
  experiment:
    build: .
    
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
      
    volumes:
      - ${USER_WORKDIR}:/workspace
      - uv-cache:/root/.cache/uv
      
    ipc: host
    stdin_open: true
    tty: true
    
    devices:
      - "nvidia.com/gpu=all"

    shm_size: 64G

volumes:
  uv-cache:
