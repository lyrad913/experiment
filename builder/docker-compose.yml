services:
  experiment:
    build: .
    
    container_name: ${CONTAINER_NAME}
    volumes:
      - ${USER_WORKDIR}:/workspace
      - uv-cache:/root/.cache/uv
      
    ipc: host
    stdin_open: true
    tty: true
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    shm_size: 64G
    environment:
      - GIT_USER_NAME
      - GIT_USER_EMAIL
      - WANDB_API_KEY
      - HF_TOKEN
      - OPENAI_API_KEY 


volumes:
  # 고정 이름: 같은 사용자(rootless dockerd)의 모든 프로젝트가 uv 캐시를 공유
  uv-cache:
    name: uv-cache
